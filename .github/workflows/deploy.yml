# ===================================================================
# Spirit Tech – Infra partagée
# Déploiement automatique sur le VPS à chaque push sur main
# ===================================================================
# Secrets GitHub requis (Settings → Secrets and variables → Actions) :
#   VPS_HOST             → 155.117.40.193
#   VPS_USER             → administrator
#   VPS_SSH_PRIVATE_KEY  → contenu de ~/.ssh/deploy_key
# ===================================================================

name: Deploy Infra

on:
  push:
    branches: [main]
  workflow_dispatch:    # déclenchement manuel depuis GitHub UI

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          script: |
            set -e

            cd /opt/infra

            echo "=== Git pull ==="
            git pull origin main

            echo "=== Docker Compose up ==="
            docker compose --env-file .env up -d --remove-orphans

            echo "=== État des services ==="
            docker compose ps

            echo "=== Déploiement infra terminé ==="
